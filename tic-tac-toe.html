<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gen Z Tic Tac Toe 🎮</title>

<link rel="stylesheet" href="tic-tac-toe.css">

</head>


<body>


<div class="container">


<h1>🎮 Tic Tac Toe</h1>


<div class="mode-box">

<h2>Choose Mode</h2>

<button id="friendBtn" class="mode-btn">
👥 Play With Friend
</button>


<button id="computerBtn" class="mode-btn">
🤖 Play With Computer
</button>


</div>



<div id="difficultyBox" class="difficulty hidden">

<h2>Select Difficulty</h2>


<button class="level" data-level="easy">
😊 Easy
</button>


<button class="level" data-level="medium">
😎 Medium
</button>


<button class="level" data-level="hard">
🔥 Hard
</button>


</div>




<div class="scoreboard">


<div>
<h3>❌ X</h3>
<p id="xScore">0</p>
</div>


<div>
<h3>🤝 Draw</h3>
<p id="drawScore">0</p>
</div>


<div>
<h3>⭕ O</h3>
<p id="oScore">0</p>
</div>


</div>




<div id="status" class="status">

Choose Game Mode

</div>




<div id="board" class="board">


<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>


<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>


<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>


</div>





<div class="buttons">


<button id="restartBtn">
🔄 Restart
</button>


<button id="resetBtn">
🗑 Reset Score
</button>


</div>




</div>






<!-- WIN / DRAW POPUP -->


<div id="popup" class="popup hidden">


<h2 id="popupTitle">
🎉 Congratulations!
</h2>


<p id="popupText">
You Win!
</p>


<button id="playAgain">
▶ Play Again
</button>


</div>






<!-- CONFETTI AREA -->

<div id="confetti"></div>






<!-- AUDIO -->

<audio id="tapSound" preload="auto"></audio>

<audio id="winSound" preload="auto"></audio>

<audio id="loseSound" preload="auto"></audio>
  
<audio id="drawSound" preload="auto"></audio>

<audio id="buttonSound" preload="auto"></audio>






<script src="tic-tac-toe.js"></script>


</body>

</html>
