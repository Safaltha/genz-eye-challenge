<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎯 Cyber Sniper Challenge</title>

<link rel="stylesheet" href="cyber-sniper.css">

</head>


<body>


<div class="game-container">


<h1>🎯 Cyber Sniper Challenge</h1>

<p class="subtitle">
Aim fast. Think smart. Become a Cyber Sniper.
</p>



<div class="stats">


<div class="stat">
⭐ Score
<h2 id="score">0</h2>
</div>


<div class="stat">
🏆 Level
<h2 id="level">1</h2>
</div>


<div class="stat">
❤️ Lives
<h2 id="lives">3</h2>
</div>


<div class="stat">
🔥 Combo
<h2 id="combo">0</h2>
</div>


<div class="stat">
🎯 Accuracy
<h2 id="accuracy">100%</h2>
</div>


<div class="stat">
🪙 Coins
<h2 id="coins">0</h2>
</div>


</div>



<div class="mission-box">

<h3 id="mode">
🎮 Normal Mode
</h3>

<p id="message">
Press Start to begin the mission.
</p>


<div class="timer">

⏱️ Time:
<span id="time">30</span>

</div>

</div>




<div id="arena">


<div id="target">

</div>


</div>




<div class="controls">


<button id="startBtn">
🚀 Start Mission
</button>


<button id="pauseBtn">
⏸ Pause
</button>


<button id="restartBtn">
🔄 Restart
</button>


</div>



<div class="progress">

<div id="levelProgress"></div>

</div>



<div class="result-box" id="resultBox">


<h2 id="resultTitle">
</h2>


<p id="resultText">
</p>


<button onclick="startGame()">
Play Again
</button>


</div>



</div>




<script src="cyber-sniper.js"></script>


</body>

</html>
