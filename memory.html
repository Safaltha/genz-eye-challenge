<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Memory Flip Challenge</title>

<link rel="stylesheet" href="memory.css">
</head>

<body>

<div class="container">

    <h1>🧠 Memory Flip Challenge</h1>

    <p class="subtitle">
        Flip the cards and match every pair as fast as you can!
    </p>

    <div class="top-bar">

        <div class="box">
            <span>⏱ Time</span>
            <h2 id="time">00:00</h2>
        </div>

        <div class="box">
            <span>🎯 Moves</span>
            <h2 id="moves">0</h2>
        </div>

        <div class="box">
            <span>🏆 Best</span>
            <h2 id="best">--</h2>
        </div>

    </div>

    <div class="controls">

        <select id="difficulty">

            <option value="easy">Easy (4×4)</option>

            <option value="medium">Medium (4×5)</option>

            <option value="hard">Hard (6×6)</option>

        </select>

        <button id="restart">
            🔄 Restart
        </button>

    </div>

    <div id="game" class="game-board">
        <!-- Cards generated by JavaScript -->
    </div>

</div>

<!-- WIN POPUP -->

<div id="popup" class="popup">

    <div class="popup-box">

        <h2>🎉 Congratulations!</h2>

        <p>You matched all the cards.</p>

        <p>
            ⏱ Time:
            <span id="finalTime"></span>
        </p>

        <p>
            🎯 Moves:
            <span id="finalMoves"></span>
        </p>

        <button id="playAgain">
            ▶ Play Again
        </button>

    </div>

</div>

<script src="memory.js"></script>

</body>
</html>
