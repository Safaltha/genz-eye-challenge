<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Memory Flip Challenge</title>
<link rel="stylesheet" href="memory.css">
</head>

<body>

<div class="container">

<h1>🧠 Memory Flip Challenge</h1>
<p class="subtitle">Match all the cards as fast as possible!</p>

<div class="top-bar">

<div class="score-box">
<div>⏱ Time</div>
<h2 id="timer">00:00</h2>
</div>

<div class="score-box">
<div>🎯 Moves</div>
<h2 id="moves">0</h2>
</div>

<div class="score-box">
<div>🏆 Best</div>
<h2 id="bestTime">--:--</h2>
</div>

</div>

<div class="controls">

<select id="difficulty">
<option value="easy">Easy (4×4)</option>
<option value="medium">Medium (4×5)</option>
<option value="hard">Hard (6×6)</option>
</select>

<button id="startBtn">▶ Start Game</button>

<button id="restartBtn">🔄 Restart</button>

</div>

<!-- REAL GAME BOARD -->
<div id="gameBoard" class="game-board"></div>

</div>

<!-- WIN POPUP -->

<div id="popup" class="popup hidden">

<div class="popup-content">

<h2>🎉 You Win!</h2>

<p>
Time:
<span id="finalTime"></span>
</p>

<p>
Moves:
<span id="finalMoves"></span>
</p>

<button id="playAgain">
Play Again
</button>

</div>

</div>

<script src="memory.js"></script>

</body>
</html>
