<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Memory Flip Challenge | Gen Z Games</title>

<link rel="stylesheet" href="memory.css">
</head>

<body>

<div class="container">

<header>

<h1>🧠 Memory Flip Challenge</h1>

<p class="subtitle">
Flip every matching pair as fast as possible.
Can you beat your best score?
</p>

</header>

<div class="top-panel">

<div class="difficulty-box">

<label for="difficulty">Difficulty</label>

<select id="difficulty">

<option value="easy">Easy (4×4)</option>

<option value="medium">Medium (4×5)</option>

<option value="hard">Hard (6×6)</option>

</select>

</div>

<div class="stats">

<div class="stat-card">
<span class="stat-title">⏱ Time</span>
<span id="timer">00:00</span>
</div>

<div class="stat-card">
<span class="stat-title">🎯 Moves</span>
<span id="moves">0</span>
</div>

<div class="stat-card">
<span class="stat-title">✅ Matches</span>
<span id="matches">0</span>
</div>

</div>

</div>

<div class="best-score">

<div>
🏆 Best Time:
<strong id="bestTime">--:--</strong>
</div>

<div>
⭐ Best Moves:
<strong id="bestMoves">--</strong>
</div>

</div>

<div class="buttons">

<button id="startBtn">
▶ Start Game
</button>

<button id="restartBtn">
🔄 Restart
</button>

</div>

<div id="gameBoard" class="game-board easy">

</div>

</div>

<div id="winPopup" class="popup hidden">

<div class="popup-content">

<h2>🎉 Congratulations!</h2>

<p>You matched every card!</p>

<div class="popup-stats">

<p>⏱ Time:
<strong id="finalTime"></strong>
</p>

<p>🎯 Moves:
<strong id="finalMoves"></strong>
</p>

</div>

<button id="playAgain">
Play Again
</button>

</div>

</div>

<div id="confetti"></div>

<script src="memory.js"></script>

</body>
</html>
