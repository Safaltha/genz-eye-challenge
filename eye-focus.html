<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👁️ Eye Focus Challenge</title>

<link rel="stylesheet" href="eye-focus.css">

</head>


<body>


<div class="container">


<h1>👁️ Eye Focus Challenge</h1>

<p class="subtitle">
Find the different letter as fast as you can!
</p>



<div class="top-bar">


<div class="info-box">
<h3>Level</h3>
<span id="level">1</span>
</div>


<div class="info-box">
<h3>Score</h3>
<span id="score">0</span>
</div>


<div class="info-box">
<h3>Time</h3>
<span id="timer">30</span>
</div>


</div>




<div class="progress">

<div id="progressBar"></div>

</div>





<div id="gameCard">


<h2 id="challengeTitle">
Find the odd letter 👁️
</h2>



<div id="grid"></div>



<p id="message">
Press Start to begin
</p>



<div class="buttons">


<button id="startBtn">
▶️ Start Game
</button>


<button id="nextBtn">
➡️ Next Level
</button>


<button id="restartBtn">
🔄 Restart
</button>


<button id="resetBtn">
🗑 Reset
</button>


</div>



</div>






<div class="stats">


<div class="stat">

<h3>🔥 Streak</h3>

<h2 id="streak">
0
</h2>

</div>



<div class="stat">

<h3>🏆 Best</h3>

<h2 id="bestStreak">
0
</h2>

</div>



<div class="stat">

<h3>🎯 Accuracy</h3>

<h2 id="accuracy">
100%
</h2>

</div>



</div>






<div class="achievement">

<h3 id="achievement">
No achievement yet
</h3>


</div>



<!-- Confetti Area -->

<div id="confetti"></div>



</div>





<!-- Sounds -->

<audio id="tapSound"></audio>

<audio id="winSound"></audio>

<audio id="loseSound"></audio>

<audio id="buttonSound"></audio>





<script src="eye-focus.js"></script>


</body>

</html>
