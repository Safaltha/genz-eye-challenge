<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🦅 Eagle Radar</title>

<link rel="stylesheet" href="eagle-radar.css">

</head>

<body>

<div class="container">

<h1>🦅 Eagle Radar</h1>

<p class="subtitle">
Memorize the target location before it disappears!
</p>

<div class="topBar">

<div class="box">
⭐ Score
<h2 id="score">0</h2>
</div>

<div class="box">
🏆 Level
<h2 id="level">1</h2>
</div>

<div class="box">
❤️ Lives
<h2 id="lives">3</h2>
</div>

<div class="box">
🪙 Coins
<h2 id="coins">0</h2>
</div>

<div class="box">
🔥 Combo
<h2 id="combo">0</h2>
</div>

</div>

<div id="message">
Press START to begin.
</div>

<div id="gameArea">

<div id="target"></div>

</div>

<div class="buttons">

<button id="startBtn">
▶ START
</button>

<button id="pauseBtn">
⏸ PAUSE
</button>

<button id="soundBtn">
🔊 SOUND
</button>

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

</div>

<script src="eagle-radar.js"></script>

</body>

</html>
