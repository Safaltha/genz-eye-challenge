<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | Gen Z Eye Challenge</title>

<meta name="description"
content="Contact Gen Z Eye Challenge for questions, feedback, suggestions, or website problems.">

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at top,#4b0082,#050014 50%,#000);
    color:white;
    padding:20px;
}

.card{
    max-width:700px;
    margin:40px auto;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 40px rgba(0,255,255,0.08);
}

h1{
    text-align:center;
    color:cyan;
    margin-bottom:15px;
}

.description{
    text-align:center;
    color:#a0a5bd;
    line-height:1.7;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    color:#ddd;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:5px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.06);
    color:white;
    outline:none;
    font-size:16px;
}

input:focus,
textarea:focus{
    border-color:cyan;
    box-shadow:0 0 10px rgba(0,255,255,0.15);
}

textarea{
    min-height:150px;
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#777b91;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,cyan,magenta);
    color:#000;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.02);
    box-shadow:0 0 25px cyan;
}

button:active{
    transform:scale(0.98);
}

#message{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    text-align:center;
    line-height:1.5;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:cyan;
    text-decoration:none;
}

.back:hover{
    text-decoration:underline;
}

.team{
    text-align:center;
    color:#777b91;
    margin-top:30px;
}

</style>

</head>


<body>

<div class="card">

<h1>📩 Contact Us</h1>

<p class="description">
Have a question, found a problem, or have an idea for a new game?
Send us your message using the form below.
</p>


<form id="contactForm">

    <label for="name">👤 Your Name</label>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
        maxlength="100"
        required
    >


    <label for="email">📧 Your Email</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        maxlength="150"
        required
    >


    <label for="contactMessage">💬 Your Message</label>

    <textarea
        id="contactMessage"
        placeholder="Write your message..."
        maxlength="1000"
        required
    ></textarea>


    <button type="submit" id="sendButton">
        📩 Send Message
    </button>

</form>


<div id="message"></div>


<p class="team">
📌 Gen Z Eye Challenge Team
</p>


<a class="back" href="index.html">
⬅ Back to Game
</a>

</div>


<script>

document
.getElementById("contactForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const userMessage =
        document.getElementById("contactMessage").value.trim();

    const messageBox =
        document.getElementById("message");

    const sendButton =
        document.getElementById("sendButton");


    // Check fields
    if(name === "" || email === "" || userMessage === ""){

        messageBox.style.display = "block";

        messageBox.style.background =
            "rgba(255,107,107,0.15)";

        messageBox.style.color = "#ff6b6b";

        messageBox.innerHTML =
            "⚠️ Please fill in all fields.";

        return;
    }


    // Basic email check
    if(!email.includes("@")){

        messageBox.style.display = "block";

        messageBox.style.background =
            "rgba(255,107,107,0.15)";

        messageBox.style.color = "#ff6b6b";

        messageBox.innerHTML =
            "⚠️ Please enter a valid email address.";

        return;
    }


    // Save message on this device
    const contacts =
        JSON.parse(
            localStorage.getItem("contactMessages") || "[]"
        );


    contacts.push({

        name:name,

        email:email,

        message:userMessage,

        date:new Date().toLocaleString()

    });


    localStorage.setItem(
        "contactMessages",
        JSON.stringify(contacts)
    );


    // Success message
    messageBox.style.display = "block";

    messageBox.style.background =
        "rgba(78,205,196,0.15)";

    messageBox.style.color =
        "#4ecdc4";

    messageBox.innerHTML =
        "✅ Thank you, " +
        name +
        "! Your message has been submitted successfully.";


    // Clear form
    document.getElementById("contactForm").reset();


    // Button feedback
    sendButton.innerText =
        "✅ Message Submitted";

    setTimeout(function(){

        sendButton.innerText =
            "📩 Send Message";

    },3000);

});

</script>


</body>

</html>
