<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Focus Follow Challenge 👁️</title>

<link rel="stylesheet" href="focus-follow.css">

</head>


<body>


<div class="container">


<h1>👁️ Focus Follow Challenge</h1>

<p>
Train your focus. Follow the moving energy orb 🔥
</p>



<div class="stats">


<div>
🏆 Score
<h2 id="score">0</h2>
</div>


<div>
🔥 Combo
<h2 id="combo">0</h2>
</div>


<div>
⚡ Level
<h2 id="level">1</h2>
</div>


<div>
⏱️ Time
<h2 id="time">30</h2>
</div>


</div>




<div id="gameBox">


<div id="orb"></div>


</div>




<button onclick="startGame()">
🚀 Start Training
</button>



<div id="message">

Press Start to begin eye training 👁️

</div>



</div>




<script src="focus-follow.js"></script>


</body>

</html>
