<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Number Memory Challenge</title>

<link rel="stylesheet" href="number-memory.css">

</head>

<body>

<div class="container">

<h1>🧠 Number Memory Challenge</h1>

<p>Memorize the number before it disappears!</p>

<div class="top-bar">

<span id="level">Level: 1</span>

<span id="best">Best: 1</span>

</div>

<h2 id="numberDisplay">Press Start</h2>

<input
type="text"
id="answer"
placeholder="Enter the number"
style="display:none;"
autocomplete="off"
>

<br><br>

<button id="checkBtn" style="display:none;">
✅ Check
</button>

<button id="startBtn">
▶️ Start Game
</button>

<h2 id="message"></h2>

</div>

<script src="number-memory.js"></script>

</body>

</html>
