<section id="quiz">

</h3>

</div>



<img id="questionImage" src="question1.jpg">



<div class="quiz-buttons">

<button id="answerBtn">
💡 Show Answer
</button>


<button id="nextBtn">

</button>

</div>

</div>



<p>
⏱️ Time:
<span id="timer">30</span>s

</div>


</section>





<section id="ai">

id="aiInput"
placeholder="Ask AI for hint...">

</button>



<div id="aiResponse">

🤖 AI Coach Ready 👁️

</div>

<p>
Player:

Guest
</span>
</p>

Best Score:

0
</span>
</p>


<p>
Achievements:
<span id="badges">
🏅 Beginner
</span>
</p>


</div>


</section>

<h2>🏆 Leaderboard</h2>


<div id="leaderboardList">

<h2>⚙️ Settings</h2>


<button id="resetBtn">

Reset Progress

</button>


</section>

<footer>

<p>
